name: Flutter CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Flutter App
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          git config --global --add safe.directory $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "FLUTTER_ROOT=$HOME/flutter" >> $GITHUB_ENV
          mkdir -p $HOME/flutter/examples
          $HOME/flutter/bin/flutter precache --android

      - name: Prepare Environment File
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          # Securely inject secrets from GitHub Secrets into .env
          if [ -n "$OPENWEATHER_API_KEY" ]; then
            grep -q "^OPENWEATHER_API_KEY=" .env && sed -i "s|^OPENWEATHER_API_KEY=.*|OPENWEATHER_API_KEY=$OPENWEATHER_API_KEY|" .env || echo "OPENWEATHER_API_KEY=$OPENWEATHER_API_KEY" >> .env
          fi
          if [ -n "$SUPABASE_URL" ]; then
            grep -q "^SUPABASE_URL=" .env && sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env || echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            grep -q "^SUPABASE_ANON_KEY=" .env && sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env || echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          fi
          if [ -n "$GROQ_API_KEY" ]; then
            grep -q "^GROQ_API_KEY=" .env && sed -i "s|^GROQ_API_KEY=.*|GROQ_API_KEY=$GROQ_API_KEY|" .env || echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Tests
        run: flutter test

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android Release APK
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          DART_DEFINES=""
          if [ -n "$OPENWEATHER_API_KEY" ]; then
            DART_DEFINES="--dart-define=OPENWEATHER_API_KEY=$OPENWEATHER_API_KEY"
          fi
          flutter build apk --release --android-skip-build-dependency-validation $DART_DEFINES

      - name: Verify Generated APK Location
        run: |
          echo "Generated APK files:"
          find build -name "*.apk" -type f

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: krishiritu-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.13 build/app/outputs/flutter-apk/app-release.apk --title "KrishiRitu Release APK v1.0.13" --notes "Release APK with password authentication auto-sync and passwordless email link sign-in" || \
          gh release upload v1.0.13 build/app/outputs/flutter-apk/app-release.apk --clobber
