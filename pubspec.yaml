name: krishiritu
description: KrishiRitu AI — Smart Farmer Season Guide for Karnataka farmers.
version: 1.0.8+9
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # UI & Fonts
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0

  # Storage (local)
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # Location
  geolocator: ^12.0.0

  # Image
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Utilities
  intl: '>=0.19.0 <1.0.0'
  uuid: ^4.4.2
  logger: ^2.4.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
